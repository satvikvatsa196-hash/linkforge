spring:
  application:
    name: linkforge
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          max-interval: 10000ms
          multiplier: 2.0
        acknowledge-mode: auto

app:
  cache:
    ttl: ${CACHE_TTL:24h}
  rate-limit:
    anonymous:
      requests: ${RATE_LIMIT_ANONYMOUS_REQUESTS:60}
      window-ms: ${RATE_LIMIT_ANONYMOUS_WINDOW_MS:60000}
  reserved-aliases: api,health,actuator,swagger,docs
  qr:
    width: ${QR_WIDTH:250}
    height: ${QR_HEIGHT:250}
  shortener:
    strategy: ${SHORTENER_STRATEGY:sequential} # Options: sequential, random
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:linkforge}
    username: ${DB_USER:linkforge_user}
    password: ${DB_PASSWORD:linkforge_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${SHOW_SQL:true}
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: ${SERVER_PORT:8080}


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.linkforge: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: ${SHOW_SQL:DEBUG}
